
<!DOCTYPE html>
<html>
<head>
    <title>Gravitational Lensing 3D Schematic</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; color: white; font-family: Arial, Helvetica, sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 12px 20px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
            font-size: 14px;
        }
        #info h1 { margin: 0; font-size: 20px; }
        #info p { margin: 5px 0 0 0; opacity: 0.8; }
    </style>
</head>
<body>
    <div id="info">
        <h1>🌌 Gravitational Lensing: Time Delay</h1>
        <p>Drag to rotate · Scroll to zoom</p>
    </div>

    <!-- 引入 Three.js 核心库和轨道控制器 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 1. 场景、相机、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 5, 10);
        camera.lookAt(3, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- 2. 控制器 (实现你想要的自由旋转和缩放) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(3, 0, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.update();

        // --- 3. 光源 ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(2, 5, 3);
        scene.add(dirLight);

        const backLight = new THREE.DirectionalLight(0x4466ff, 0.5);
        backLight.position.set(-2, 1, -3);
        scene.add(backLight);

        const pointLight = new THREE.PointLight(0xffaa00, 0.5, 20);
        pointLight.position.set(2, 1, 2);
        scene.add(pointLight);

        // --- 4. 辅助元素：星空背景粒子 ---
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 2000;
        const starPositions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i += 3) {
            starPositions[i] = (Math.random() - 0.5) * 200;
            starPositions[i+1] = (Math.random() - 0.5) * 200;
            starPositions[i+2] = (Math.random() - 0.5) * 200;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // --- 5. 创建场景元素 ---

        // 5.1 地球 (观测者)
        const earthGeo = new THREE.SphereGeometry(0.6, 32, 32);
        const earthMat = new THREE.MeshStandardMaterial({ color: 0x22aa88, emissive: 0x114433, emissiveIntensity: 0.2 });
        const earth = new THREE.Mesh(earthGeo, earthMat);
        earth.position.set(0, 0, 0);
        scene.add(earth);
        // 地球发光光晕 (小粒子环)
        const glowGeo = new THREE.SphereGeometry(0.7, 16, 16);
        const glowMat = new THREE.MeshBasicMaterial({ color: 0x22ffaa, wireframe: true, transparent: true, opacity: 0.15 });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        glow.position.set(0, 0, 0);
        scene.add(glow);

        // 5.2 透镜星系 (金色)
        const lensGroup = new THREE.Group();
        lensGroup.position.set(2, 0, 0);
        // 星系核心
        const coreGeo = new THREE.SphereGeometry(0.4, 24, 24);
        const coreMat = new THREE.MeshStandardMaterial({ color: 0xffaa33, emissive: 0xcc7722, emissiveIntensity: 0.3 });
        const core = new THREE.Mesh(coreGeo, coreMat);
        lensGroup.add(core);
        // 星系盘 (扁平的圆环)
        const diskGeo = new THREE.TorusGeometry(0.9, 0.05, 16, 32);
        const diskMat = new THREE.MeshStandardMaterial({ color: 0xffaa33, emissive: 0x995522, emissiveIntensity: 0.2 });
        const disk = new THREE.Mesh(diskGeo, diskMat);
        disk.rotation.x = Math.PI / 2;
        lensGroup.add(disk);
        // 第二个盘，倾斜一点增加立体感
        const disk2 = new THREE.Mesh(
            new THREE.TorusGeometry(0.7, 0.04, 16, 32),
            new THREE.MeshStandardMaterial({ color: 0xffbb44, emissive: 0x884422, emissiveIntensity: 0.15 })
        );
        disk2.rotation.z = 0.3;
        disk2.rotation.x = Math.PI / 2.5;
        lensGroup.add(disk2);
        scene.add(lensGroup);

        // 透镜引力环 (半透明的爱因斯坦环)
        const ringPoints = [];
        const radius = 1.2;
        const segments = 64;
        for (let i = 0; i <= segments; i++) {
            const theta = (i / segments) * Math.PI * 2;
            ringPoints.push(new THREE.Vector3(2 + radius * Math.cos(theta), radius * Math.sin(theta), 0));
        }
        const ringGeo = new THREE.BufferGeometry().setFromPoints(ringPoints);
        const ringMat = new THREE.LineBasicMaterial({ color: 0xffaa33, transparent: true, opacity: 0.25 });
        const ringLine = new THREE.Line(ringGeo, ringMat);
        scene.add(ringLine);

        // 5.3 FRB源 (闪烁的黄色星)
        const sourceGroup = new THREE.Group();
        sourceGroup.position.set(6, 0, 0);
        // 主体
        const sourceGeo = new THREE.SphereGeometry(0.5, 24, 24);
        const sourceMat = new THREE.MeshStandardMaterial({ color: 0xffdd44, emissive: 0xff8800, emissiveIntensity: 0.5 });
        const sourceMesh = new THREE.Mesh(sourceGeo, sourceMat);
        sourceGroup.add(sourceMesh);
        // 十字星芒 (两个交叉的薄片)
        const spikeMat = new THREE.MeshBasicMaterial({ color: 0xffaa44, transparent: true, opacity: 0.3 });
        const spikeGeo = new THREE.PlaneGeometry(1.4, 0.08);
        const spike1 = new THREE.Mesh(spikeGeo, spikeMat);
        spike1.rotation.z = Math.PI / 4;
        sourceGroup.add(spike1);
        const spike2 = new THREE.Mesh(spikeGeo, spikeMat);
        spike2.rotation.z = -Math.PI / 4;
        sourceGroup.add(spike2);
        scene.add(sourceGroup);
        // 源的光晕
        const glowSourceGeo = new THREE.SphereGeometry(0.7, 16, 16);
        const glowSourceMat = new THREE.MeshBasicMaterial({ color: 0xffaa44, wireframe: true, transparent: true, opacity: 0.15 });
        const glowSource = new THREE.Mesh(glowSourceGeo, glowSourceMat);
        glowSource.position.set(6, 0, 0);
        scene.add(glowSource);

        // --- 6. 光路绘制 ---

        // 6.1 直接光路 (蓝色虚线)
        const directPoints = [];
        for (let i = 0; i <= 30; i++) {
            const t = i / 30;
            const x = 6 * (1 - t) + 0 * t;
            const y = 0;
            const z = 0;
            directPoints.push(new THREE.Vector3(x, y, z));
        }
        const directGeo = new THREE.BufferGeometry().setFromPoints(directPoints);
        const directMat = new THREE.LineDashedMaterial({ color: 0x44aaff, dashSize: 0.15, gapSize: 0.1, linewidth: 2 });
        const directLine = new THREE.Line(directGeo, directMat);
        directLine.computeLineDistances();
        scene.add(directLine);

        // 6.2 弯曲光路 (红色实线，带发光效果)
        const curvedPoints = [];
        for (let i = 0; i <= 30; i++) {
            const t = i / 30;
            const x = 6 * (1 - t) + 0 * t;
            const y = 1.8 * Math.sin(t * Math.PI);
            const z = 0;
            curvedPoints.push(new THREE.Vector3(x, y, z));
        }
        const curvedGeo = new THREE.BufferGeometry().setFromPoints(curvedPoints);
        const curvedMat = new THREE.LineBasicMaterial({ color: 0xff6666, linewidth: 2 });
        const curvedLine = new THREE.Line(curvedGeo, curvedMat);
        scene.add(curvedLine);

        // 弯曲路径发光管道 (TubeGeometry，类似光柱效果)
        const curve = new THREE.CatmullRomCurve3(curvedPoints);
        const tubeGeo = new THREE.TubeGeometry(curve, 64, 0.04, 8, false);
        const tubeMat = new THREE.MeshBasicMaterial({ color: 0xff4444, transparent: true, opacity: 0.15 });
        const tube = new THREE.Mesh(tubeGeo, tubeMat);
        scene.add(tube);

        // 6.3 光路上的方向指示 (小光球沿路径移动)
        const spherePath = new THREE.Mesh(
            new THREE.SphereGeometry(0.12, 8, 8),
            new THREE.MeshBasicMaterial({ color: 0xff8888 })
        );
        scene.add(spherePath);

        // 第二个光球在直接路径上
        const sphereDirect = new THREE.Mesh(
            new THREE.SphereGeometry(0.12, 8, 8),
            new THREE.MeshBasicMaterial({ color: 0x88ccff })
        );
        scene.add(sphereDirect);

        // 时间标签 (使用精灵，直接在3D场景中显示文字)
        function createLabel(text, position, color = '#ffffff', size = 0.6) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 128;
            context.fillStyle = 'rgba(0,0,0,0)';
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.font = 'Bold 36px Arial';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillStyle = color;
            context.fillText(text, canvas.width/2, canvas.height/2);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
            const sprite = new THREE.Sprite(material);
            sprite.position.set(position[0], position[1], position[2]);
            sprite.scale.set(size * 2, size * 0.5, 1);
            return sprite;
        }

        scene.add(createLabel('🌍 Earth', [0, -1.2, 0], '#88ffaa', 0.8));
        scene.add(createLabel('🌀 Lensing Galaxy', [2, -1.8, 0], '#ffaa33', 0.9));
        scene.add(createLabel('⭐ FRB Source', [6, -1.2, 0], '#ffdd44', 0.8));
        scene.add(createLabel('Direct Path', [3, -0.8, 0], '#44aaff', 0.7));
        scene.add(createLabel('Delayed Path', [3, 2.5, 0], '#ff6666', 0.7));
        scene.add(createLabel('⏱ Δt ≈ 24.9 days', [3, 3.6, 0], '#ffffff', 1.0));

        // --- 7. 动画循环 ---
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);

            time += 0.02;

            // 沿路径移动小光球
            const pathPos = (Math.sin(time * 0.8) + 1) / 2; // 0-1 来回
            const idx = Math.floor(pathPos * 30);
            if (idx < curvedPoints.length) {
                spherePath.position.copy(curvedPoints[idx]);
                sphereDirect.position.copy(directPoints[idx]);
            }

            // 闪烁星芒
            const pulse = Math.sin(time * 2) * 0.2 + 0.8;
            sourceMesh.material.emissiveIntensity = 0.3 + pulse * 0.4;
            glowSourceMat.opacity = 0.1 + pulse * 0.15;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- 8. 窗口大小自适应 ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
